<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Escolar – Escuela Primaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c2340;--mut:#5a6b85;--blue:#1b4fd8;--blue-d:#123a9e;--soft:#e8effc;--rule:#d3ddef;--bg:#f3f6fb;--ok:#0f7b55;--warn:#a15c07}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* --- Pantalla de Login --- */
#login-view{display:flex;height:100vh;width:100%;align-items:center;justify-content:center;background:var(--bg)}
#login-box{background:#fff;padding:34px;border-radius:12px;border:1px solid var(--rule);width:100%;max-width:360px;display:grid;gap:20px;box-shadow:0 10px 25px rgba(12,35,64,.05)}
#login-box h2{color:var(--blue-d);text-align:center;font:600 24px/1.1 Newsreader,serif;margin-bottom:8px}
#login-box svg{width:48px;height:48px;margin:0 auto;display:block}
#app-view{display:none;width:100%;min-height:100vh}

aside{width:250px;flex:none;background:#fff;border-right:1px solid var(--rule);padding:26px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:600 19px/1.1 Newsreader,serif;display:block}
.brand span{font-size:12.5px;color:var(--mut)}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
.grp{font-size:12.5px;color:var(--mut);margin:16px 12px 4px;font-weight:600}
#nav button{background:none;border:0;border-left:3px solid transparent;text-align:left;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:15px;font-weight:500;color:#33445f}
#nav button:hover{background:var(--soft)}
#nav button.on{background:var(--soft);color:var(--blue-d);font-weight:700;border-left-color:var(--blue)}
.sf{display:flex;flex-direction:column;gap:8px;padding:14px 10px 0;border-top:1px solid var(--rule);font-size:13px}
.sf a,.sf button{color:var(--mut);background:none;border:0;font-size:13px;text-align:left;cursor:pointer;padding:0;text-decoration:none}
.sf a:hover,.sf button:hover{color:var(--blue)}
.sf small{color:var(--mut);font-size:12px}

main{flex:1;min-width:0;max-width:1180px;padding:34px 44px 50px}
#head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:20px;margin-bottom:26px;border-bottom:2px solid var(--blue)}
h1{font:600 34px/1.1 Newsreader,serif;letter-spacing:-.01em}
#head p{color:var(--mut);margin-top:6px}
.pri,.ghost{padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.pri{background:var(--blue);color:#fff;border:0}.pri:hover{background:var(--blue-d)}
.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--rule)}.ghost:hover{background:var(--soft)}

/* Hoja de registro */
.sheet{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.tools input{width:min(340px,100%);padding:9px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px}
#cnt{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--blue-d);background:var(--soft);padding:12px 18px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:13px 18px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
tbody td:first-child{box-shadow:inset 3px 0 var(--blue);font-weight:600}
.act{text-align:right;white-space:nowrap}
.act button{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px;border-radius:6px}
.act button:hover{background:var(--soft)}
.act .del{color:#b42318}.act .del:hover{background:#fdecea}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--blue-d);font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f5ec;color:var(--ok)}.tag.warn{background:#fdf1dc;color:var(--warn)}.tag.wip{background:#dfe9ff;color:var(--blue-d)}
td.empty{text-align:center;color:var(--mut);padding:36px}

/* Resumen */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--rule);border-radius:10px}
.strip div{padding:22px 24px;border-right:1px solid var(--rule)}.strip div:last-child{border:0}
.strip b{display:block;font:600 44px/1 Newsreader,serif;color:var(--blue);margin-bottom:6px}
.strip span{color:var(--mut);font-size:14px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:22px;margin-top:22px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
h2{font:600 20px Newsreader,serif;margin-bottom:14px}
.bar{display:grid;grid-template-columns:48px 1fr 24px;align-items:center;gap:10px;margin:8px 0}
.bar i{height:12px;background:var(--blue);border-radius:3px}
.bar em{font-style:normal;font-weight:600;text-align:right}
.quick{display:flex;flex-direction:column;gap:8px}
.quick button{text-align:left;background:var(--soft);border:0;color:var(--blue-d);font-weight:600;font-size:14px;padding:10px 14px;border-radius:8px;cursor:pointer}
.quick button:hover{background:#d6e3fb}
p.empty{color:var(--mut)}

/* Formulario */
dialog{border:0;border-radius:12px;padding:0;width:min(520px,92vw);box-shadow:0 24px 60px rgba(12,35,64,.3);margin:auto}
dialog::backdrop{background:rgba(12,35,64,.5)}
dialog header{background:var(--blue);padding:18px 24px}
dialog h2{color:#fff;margin:0}
#ff{padding:22px 24px;display:grid;gap:14px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:#33445f}
label input,label select{padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:15px;font-weight:400;color:var(--ink);background:#fff}
.foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px}

@media(max-width:900px){
 body{flex-direction:column}
 #app-view{flex-direction:column}
 aside{width:100%;height:auto;position:static;gap:10px;padding:16px}
 #nav{flex-direction:row;overflow-x:auto;flex:none;gap:6px}
 .grp,.sf{display:none}
 #nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
 #nav button.on{border-bottom-color:var(--blue)}
 main{padding:24px 18px}
 .strip{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
 #head{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="login-view">
  <div id="login-box">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1b4fd8"/><path d="M10 12h8a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3h-7zM30 12h-8a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h7z" fill="#fff"/></svg>
    <h2>Iniciar Sesión</h2>
    <label>Perfil de acceso:
      <select id="rol-input">
        <option value="director">Director</option>
        <option value="profesor">Profesor</option>
        <option value="personal">Personal Administrativo</option>
        <option value="tutor">Tutor (Solo lectura)</option>
        <option value="alumno">Alumno (Solo lectura)</option>
      </select>
    </label>
    <label>Contraseña: 
      <input type="password" id="pass-input" value="1234">
    </label>
    <button class="pri" onclick="iniciarSesion()">Entrar al Sistema</button>
  </div>
</div>

<!-- Aplicación Principal -->
<div id="app-view">
  <aside>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1b4fd8"/><path d="M10 12h8a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3h-7zM30 12h-8a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h7z" fill="#fff"/></svg>
      <div><b>Escuela Primaria</b><span>Gestión escolar</span></div>
    </div>
    <nav id="nav" aria-label="Módulos"></nav>
    <div class="sf">
      <button onclick="logout()">Cerrar sesión</button>
      <button onclick="reset()">Restaurar datos</button>
      <small>Los datos viven en este navegador.</small>
    </div>
  </aside>

  <main>
    <div id="head"></div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="form">
    <header><h2 id="ft"></h2></header>
    <div id="ff"></div>
    <div class="foot">
      <button type="button" class="ghost" onclick="$('#dlg').close()">Cancelar</button>
      <button class="pri">Guardar</button>
    </div>
  </form>
  <datalist id="dl"></datalist>
</dialog>

<script>
const KEY='escuela-primaria-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=[];for(let g=1;g<=6;g++)['A','B','C'].forEach(l=>G.push(g+'° '+l));
const ST={'Completado':'ok','En proceso':'wip','Pendiente':'warn'};

/* Base de Datos Local */
const M={
 alumnos:{t:'Alumnos y tutores',s:'Matrículas y responsables legales de cada alumno.',add:'Agregar alumno',f:[
  {k:'matricula',l:'Matrícula'},{k:'nombre',l:'Nombre del alumno'},{k:'grupo',l:'Grupo',sel:G,badge:1},
  {k:'tutor',l:'Tutor responsable'},{k:'telefono',l:'Teléfono',type:'tel'}],
  seed:[
  {matricula:'2026-PRI-001',nombre:'Sofía Martínez Pérez',grupo:'3° A',tutor:'Carmen Pérez Gómez',telefono:'55-1234-5678'},
  {matricula:'2026-PRI-002',nombre:'Alejandro Gómez Ruiz',grupo:'4° B',tutor:'Roberto Gómez Alanís',telefono:'55-8765-4321'},
  {matricula:'2026-PRI-003',nombre:'Valentina Torres López',grupo:'5° A',tutor:'Lucía López Morales',telefono:'55-9876-5432'},
  {matricula:'2026-PRI-004',nombre:'Mateo Hernández Vega',grupo:'2° C',tutor:'Ana Vega Soto',telefono:'55-2468-1357'}]},
 academico:{t:'Gestión académica',s:'Materias cursadas y calificación final de cada alumno.',add:'Registrar calificación',f:[
  {k:'matricula',l:'Matrícula'},{k:'alumno',l:'Alumno',dl:1},{k:'materia',l:'Asignatura'},
  {k:'creditos',l:'Créditos',type:'number'},{k:'calificacion',l:'Calificación final',type:'number',max:10}],
  seed:[
  {matricula:'2026-PRI-001',alumno:'Sofía Martínez Pérez',materia:'Matemáticas III',creditos:8,calificacion:9.5},
  {matricula:'2026-PRI-001',alumno:'Sofía Martínez Pérez',materia:'Español III',creditos:8,calificacion:9.2},
  {matricula:'2026-PRI-002',alumno:'Alejandro Gómez Ruiz',materia:'Ciencias Naturales IV',creditos:7,calificacion:8.8}]},
 personal:{t:'Personal',s:'Plantilla, puestos y sueldo mensual de cada empleado.',add:'Agregar empleado',f:[
  {k:'id',l:'ID de empleado'},
  {k:'puesto',l:'Puesto',sel:['Docente titular','Personal de enfermería','Personal de cafetería','Mantenimiento','Administrativo','Dirección'],badge:1},
  {k:'salario',l:'Salario mensual',type:'number',money:1},{k:'area',l:'Área o especialidad'}],
  seed:[
  {id:'EMP-101',puesto:'Docente titular',salario:14500,area:'Matemáticas y Ciencias (3° A)'},
  {id:'EMP-102',puesto:'Personal de enfermería',salario:11200,area:'Primeros auxilios, turno matutino'},
  {id:'EMP-103',puesto:'Personal de cafetería',salario:9800,area:'Turno matutino, operación de caja'},
  {id:'EMP-104',puesto:'Mantenimiento',salario:10500,area:'Instalaciones hidráulicas'}]},
 enfermeria:{t:'Enfermería',s:'Atenciones médicas brindadas a los alumnos.',add:'Registrar atención',f:[
  {k:'fecha',l:'Fecha y hora',type:'datetime-local'},{k:'alumno',l:'Alumno',dl:1},
  {k:'diagnostico',l:'Diagnóstico'},{k:'tratamiento',l:'Tratamiento suministrado'}],
  seed:[
  {fecha:'2026-10-09T10:15',alumno:'Sofía Martínez Pérez',diagnostico:'Dolor de cabeza leve',tratamiento:'Reposo 15 min e hidratación'},
  {fecha:'2026-10-08T12:40',alumno:'Mateo Hernández Vega',diagnostico:'Rasguño en rodilla',tratamiento:'Limpieza antiséptica y curación'}]},
 cafeteria:{t:'Cafetería',s:'Ventas realizadas a los alumnos.',add:'Registrar venta',f:[
  {k:'id',l:'ID de venta'},{k:'fecha',l:'Fecha y hora',type:'datetime-local'},
  {k:'alumno',l:'Alumno comprador',dl:1},{k:'total',l:'Total pagado',type:'number',money:1}],
  seed:[
  {id:'V-901',fecha:'2026-10-09T11:05',alumno:'Alejandro Gómez Ruiz',total:35},
  {id:'V-902',fecha:'2026-10-09T11:20',alumno:'Valentina Torres López',total:50}]},
 mantenimiento:{t:'Mantenimiento',s:'Reportes de instalaciones y su estado de atención.',add:'Reportar incidencia',f:[
  {k:'id',l:'ID de reporte'},{k:'ubicacion',l:'Ubicación'},{k:'descripcion',l:'Descripción de la incidencia'},
  {k:'fecha',l:'Fecha',type:'date'},{k:'estado',l:'Estado',sel:['Pendiente','En proceso','Completado'],badge:1}],
  seed:[
  {id:'MANT-01',ubicacion:'Edificio A, salón 302',descripcion:'Reparación de luminaria principal',fecha:'2026-10-07',estado:'Completado'},
  {id:'MANT-02',ubicacion:'Sanitarios planta baja',descripcion:'Mantenimiento preventivo en llave de lavabo',fecha:'2026-10-09',estado:'En proceso'}]}
};
const GROUPS=[['',['dash']],['Escuela',['alumnos','academico','personal']],['Servicios',['enfermeria','cafeteria','mantenimiento']]];

/* Lógica de Control de Accesos (RBAC) Local */
const PERMISOS = {
  director: { modulos: ['alumnos', 'academico', 'personal', 'enfermeria', 'cafeteria', 'mantenimiento'], edita: true },
  profesor: { modulos: ['alumnos', 'academico'], edita: true },
  personal: { modulos: ['alumnos', 'enfermeria', 'cafeteria', 'mantenimiento'], edita: true },
  tutor: { modulos: ['academico', 'enfermeria', 'cafeteria'], edita: false },
  alumno: { modulos: ['academico', 'cafeteria'], edita: false }
};

let db=load(),cur='dash',q='',editing=null, rolActual=null;

function iniciarSesion() {
  const rol = document.getElementById('rol-input').value;
  const pass = document.getElementById('pass-input').value;
  
  if(pass === '1234') { 
    rolActual = PERMISOS[rol];
    $('#login-view').style.display = 'none';
    $('#app-view').style.display = 'flex';
    window.history.replaceState({}, document.title, window.location.pathname);
    go('dash'); 
  } else {
    alert('Contraseña incorrecta. Por favor usa "1234" para acceder.');
  }
}

function logout() {
  rolActual = null;
  $('#login-view').style.display = 'flex';
  $('#app-view').style.display = 'none';
  document.getElementById('pass-input').value = '1234';
}

function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}
 const d={};for(const k in M)d[k]=M[k].seed.map((r,i)=>({_id:i+1,...r}));return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const money=n=>'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2});

function cell(f,v){
 if(f.badge)return `<span class="tag ${ST[v]\vert{}\vert{}''}">${esc(v)}</span>`;
 if(f.money)return money(v);
 if(f.type==='datetime-local')return esc(String(v).replace('T',' '));
 return esc(v)}

function nav(){
 if(!rolActual) return;
 $('#nav').innerHTML=GROUPS.map(([g,ks])=>{
  const permitidos = ks.filter(k => k === 'dash' || rolActual.modulos.includes(k));
  if(permitidos.length === 0) return '';
  return (g?`<p class="grp">${g}</p>`:'')+
  permitidos.map(k=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${k==='dash'?'Resumen':M[k].t}</button>`).join('');
 }).join('')}

function go(k){cur=k;q='';nav();render();scrollTo(0,0)}

function render(){
 const m=M[cur];
 const btnAgregar = (cur !== 'dash' && rolActual.edita) ? `<button class="pri" onclick="openForm('${cur}')">+ ${m.add}</button>` : '';

 $('#head').innerHTML=cur==='dash'
  ?`<div><h1>Panel de la escuela</h1><p>Ciclo escolar 2026. Lo que hay registrado hoy.</p></div>`
  :`<div><h1>${m.t}</h1><p>${m.s}</p></div>${btnAgregar}`;
 $('#view').innerHTML=cur==='dash'?dash():table();
 if(cur!=='dash')fill()}

function dash(){
 const a=db.alumnos,c=db.academico;
 const prom=c.length?(c.reduce((s,r)=>s+ +r.calificacion,0)/c.length).toFixed(1):'–';
 const abiertos=db.mantenimiento.filter(r=>r.estado!=='Completado').length;
 const fig=[[a.length,'alumnos registrados'],[db.personal.length,'empleados en plantilla'],[prom,'promedio general'],[abiertos,'reportes de mantenimiento abiertos']];
 const por={};a.forEach(r=>por[r.grupo]=(por[r.grupo]||0)+1);
 const max=Math.max(1,...Object.values(por));
 
 const quickBtns = rolActual.edita 
    ? Object.keys(M).filter(k => rolActual.modulos.includes(k)).map(k=>`<button onclick="go('${k}');openForm('${k}')">${M[k].add}</button>`).join('') 
    : '';
 const panelQuick = quickBtns ? `<section class="panel"><h2>Registro rápido</h2><div class="quick">${quickBtns}</div></section>` : '';

 return `<div class="strip">${fig.map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <div class="two">
  <section class="panel"><h2>Alumnos por grupo</h2>${Object.keys(por).sort().map(g=>`<div class="bar"><span>${g}</span><i style="width:${por[g]/max*100}%"></i><em>${por[g]}</em></div>`).join('')||'<p class="empty">Aún no hay alumnos. Agrega el primero desde el registro rápido.</p>'}</section>
  ${panelQuick}
 </div>`}

function table(){
 const m=M[cur];
 const thAcciones = rolActual.edita ? `<th></th>` : ``;
 return `<div class="sheet"><div class="tools"><input type="search" placeholder="Buscar en ${m.t.toLowerCase()}" value="${esc(q)}" oninput="q=this.value.toLowerCase();fill()"><span id="cnt"></span></div>
 <div class="tw"><table><thead><tr>${m.f.map(f=>`<th>${f.l}</th>`).join('')}${thAcciones}</tr></thead><tbody id="tb"></tbody></table></div></div>`}

function fill(){
 const m=M[cur],rows=db[cur].filter(r=>!q||m.f.some(f=>String(r[f.k]).toLowerCase().includes(q)));
 $('#cnt').textContent=rows.length+(rows.length===1?' registro':' registros');
 
 const acciones = (id) => rolActual.edita 
    ? `<td class="act"><button onclick="openForm('${cur}',${id})">Editar</button><button class="del" onclick="del(${id})">Eliminar</button></td>`
    : ``;

 $('#tb').innerHTML=rows.map(r=>`<tr>${m.f.map(f=>`<td>${cell(f,r[f.k])}</td>`).join('')}${acciones(r._id)}</tr>`).join('')
  ||`<tr><td class="empty" colspan="9">${q?'Ningún resultado. Prueba con otra palabra.':'Aún no hay registros.'}</td></tr>`}

function openForm(k,id){
 const m=M[k],r=id?db[k].find(x=>x._id===id):{};editing={k,id};
 const n=new Date(),p=x=>String(x).padStart(2,'0'),d=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
 $('#ft').textContent=id?'Editar registro':m.add;
 $('#ff').innerHTML=m.f.map(f=>{
  const v=r[f.k]??(f.type==='date'?d:f.type==='datetime-local'?`${d}T${p(n.getHours())}:${p(n.getMinutes())}`:'');
  const inp=f.sel
   ?`<select name="${f.k}">${f.sel.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`
   :`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?`step="any" min="0"${f.max?` max="${f.max}"`:''}`:''} ${f.dl?'list="dl"':''} required>`;
  return `<label>${f.l}${inp}</label>`}).join('');
 $('#dl').innerHTML=db.alumnos.map(a=>`<option value="${esc(a.nombre)}">`).join('');
 $('#dlg').showModal()}

$('#form').onsubmit=e=>{
 e.preventDefault();
 const {k,id}=editing,d=Object.fromEntries(new FormData(e.target));
 M[k].f.forEach(f=>{if(f.type==='number')d[f.k]=parseFloat(d[f.k])});
 if(id)Object.assign(db[k].find(x=>x._id===id),d);
 else db[k].push({_id:Math.max(0,...db[k].map(x=>x._id))+1,...d});
 save();$('#dlg').close();render()};

function del(id){
 if(confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')){db[cur]=db[cur].filter(r=>r._id!==id);save();render()}}
function reset(){
 if(confirm('Se borrarán tus cambios y volverán los datos de ejemplo.')){localStorage.removeItem(KEY);db=load();logout()}}
