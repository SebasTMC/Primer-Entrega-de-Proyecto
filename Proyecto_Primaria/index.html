<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Escolar – Escuela Primaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c2340;--mut:#5a6b85;--blue:#1b4fd8;--blue-d:#123a9e;--soft:#e8effc;--rule:#d3ddef;--bg:#f3f6fb;--ok:#0f7b55;--warn:#a15c07;--err:#b42318}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
aside{width:250px;flex:none;background:#fff;border-right:1px solid var(--rule);padding:26px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:600 19px/1.1 Newsreader,serif;display:block}
.brand span{font-size:12.5px;color:var(--mut)}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
.grp{font-size:12px;color:var(--mut);margin:14px 12px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#nav button{background:none;border:0;border-left:3px solid transparent;text-align:left;cursor:pointer;padding:8px 12px;border-radius:8px;font-size:14.5px;font-weight:500;color:#33445f}
#nav button:hover{background:var(--soft)}
#nav button.on{background:var(--soft);color:var(--blue-d);font-weight:700;border-left-color:var(--blue)}
.sf{display:flex;flex-direction:column;gap:8px;padding:14px 10px 0;border-top:1px solid var(--rule);font-size:13px}
.sf a,.sf button{color:var(--mut);background:none;border:0;font-size:13px;text-align:left;cursor:pointer;padding:0;text-decoration:none}
.sf a:hover,.sf button:hover{color:var(--blue)}
.sf small{color:var(--ok);font-size:12px;font-weight:600}
#who{color:var(--ink);font-weight:600;font-size:13px}
main{flex:1;min-width:0;max-width:1200px;padding:34px 44px 50px}
#head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:20px;margin-bottom:26px;border-bottom:2px solid var(--blue)}
h1{font:600 34px/1.1 Newsreader,serif;letter-spacing:-.01em}
#head p{color:var(--mut);margin-top:6px}
.pri,.ghost{padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center}
.pri{background:var(--blue);color:#fff;border:0}.pri:hover{background:var(--blue-d)}
.ghost{background:#fff;color:var(--blue-d);border:1px solid var(--rule)}.ghost:hover{background:var(--soft)}
.sheet{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.tools input{width:min(340px,100%);padding:9px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px}
#cnt{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--blue-d);background:var(--soft);padding:12px 16px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
tbody td:first-child{box-shadow:inset 3px 0 var(--blue);font-weight:600}
.act{text-align:right;white-space:nowrap}
.act button{background:none;border:0;color:var(--blue);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 8px;border-radius:6px}
.act button:hover{background:var(--soft)}
.act .del{color:var(--err)}.act .del:hover{background:#fdecea}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--blue-d);font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f5ec;color:var(--ok)}.tag.warn{background:#fdf1dc;color:var(--warn)}.tag.wip{background:#dfe9ff;color:var(--blue-d)}.tag.err{background:#fdecea;color:var(--err)}
td.empty{text-align:center;color:var(--mut);padding:36px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--rule);border-radius:10px}
.strip.s3{grid-template-columns:repeat(3,1fr)}
.strip div{padding:22px 24px;border-right:1px solid var(--rule)}.strip div:last-child{border:0}
.strip b{display:block;font:600 42px/1 Newsreader,serif;color:var(--blue);margin-bottom:6px}
.s3 div:first-child b{font-size:24px;line-height:1.2}
.strip span{color:var(--mut);font-size:14px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:22px;margin-top:22px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:22px 24px;overflow-x:auto}
h2{font:600 20px Newsreader,serif;margin-bottom:14px}
.bar{display:grid;grid-template-columns:48px 1fr 24px;align-items:center;gap:10px;margin:8px 0}
.bar i{height:12px;background:var(--blue);border-radius:3px}
.bar em{font-style:normal;font-weight:600;text-align:right}
.quick{display:flex;flex-direction:column;gap:8px}
.quick button{text-align:left;background:var(--soft);border:0;color:var(--blue-d);font-weight:600;font-size:14px;padding:10px 14px;border-radius:8px;cursor:pointer}
.quick button:hover{background:#d6e3fb}
p.empty,.hint{color:var(--mut)}
.hint{font-size:12.5px}
.toast{margin-bottom:16px;padding:11px 14px;border-radius:8px;font-size:13.5px;display:none}
.toast.ok{display:block;background:#e3f5ec;color:var(--ok);border:1px solid #a7e3c6}
.toast.err{display:block;background:#fdecea;color:var(--err);border:1px solid #f5c2be}
dialog{border:0;border-radius:12px;padding:0;width:min(580px,94vw);box-shadow:0 24px 60px rgba(12,35,64,.3);margin:auto;max-height:90vh;overflow-y:auto}
dialog::backdrop{background:rgba(12,35,64,.5)}
dialog header,#lf header{background:var(--blue);padding:18px 24px}
dialog h2,#lf h2{color:#fff;margin:0}
#ff,#lb,#info-body{padding:22px 24px;display:grid;gap:12px}
.form-sec{font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--blue-d);border-bottom:1px solid var(--rule);padding-bottom:4px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:#33445f}
label input,label select,label textarea{padding:9px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14.5px;font-weight:400;color:var(--ink);background:#fff}
.foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px}
#login{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:var(--bg);padding:18px}
body.out #login{display:grid}body.out aside,body.out main{display:none}
#lf{background:#fff;border:1px solid var(--rule);border-radius:12px;width:min(430px,100%);box-shadow:0 20px 50px rgba(12,35,64,.12);overflow:hidden}
#le{color:var(--err);font-size:13px;min-height:18px}
/* Mapa SVG nuevo */
.map-bar{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}
.svg-wrap{background:#f8fafc;border:1px solid var(--rule);border-radius:10px;padding:12px;overflow:auto;text-align:center}
.svg-wrap svg{max-width:100%;height:auto;display:block;margin:auto}
.espacio-svg{cursor:pointer;transition:.2s}
.espacio-svg:hover{opacity:.82}
.espacio-ocupado{stroke:#38bdf8 !important;stroke-width:3 !important}
.espacio-activo{stroke:#f59e0b !important;stroke-width:4.5 !important;filter:drop-shadow(0 0 8px rgba(245,158,11,.95))}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid #334155}
.info-box{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--rule);font-size:14px}
.resp-card{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#f8fafc}
@media(max-width:900px){
 body{flex-direction:column}
 aside{width:100%;height:auto;position:static;gap:10px;padding:16px}
 #nav{flex-direction:row;overflow-x:auto;flex:none;gap:6px}
 .grp{display:none}.sf{flex-direction:row;flex-wrap:wrap;gap:6px 14px;padding:8px 0 0;border:0}
 #nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
 #nav button.on{border-bottom-color:var(--blue)}
 main{padding:24px 18px}
 .strip,.strip.s3,.grid2{grid-template-columns:1fr}
 .two,.map-bar{grid-template-columns:1fr}
 #head{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body class="out">

<!-- LOGIN LIMPIO SIN CREDENCIALES VISIBLES -->
<div id="login">
 <form id="lf">
  <header><h2>Iniciar sesión</h2></header>
  <div id="lb">
   <label>Usuario o correo<input id="lu" autocomplete="username" placeholder="Ingresa tu usuario o correo" required></label>
   <label>Contraseña<input id="lc" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required></label>
   <p id="le" role="alert"></p>
   <button class="pri">Entrar al sistema</button>
   <a href="padres.html" class="ghost">¿Eres padre o tutor? Ir al Portal de Padres →</a>
  </div>
 </form>
</div>

<aside>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1b4fd8"/><path d="M10 12h8a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3h-7zM30 12h-8a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h7z" fill="#fff"/></svg>
    <div><b>Escuela Primaria</b><span>Gestión escolar</span></div>
  </div>
  <nav id="nav" aria-label="Módulos"></nav>
  <div class="sf">
    <span id="who"></span>
    <button onclick="logout()">Cerrar sesión</button>
    <a href="padres.html">Portal de Padres</a>
    <a href="../index.html">Volver al menú principal</a>
    <small>● Conectado a PostgreSQL</small>
  </div>
</aside>

<main>
  <div id="toast" class="toast"></div>
  <div id="head"></div>
  <div id="view"></div>
</main>

<!-- MODAL DE FORMULARIOS -->
<dialog id="dlg">
  <form id="form">
    <header><h2 id="ft"></h2></header>
    <div id="ff"></div>
    <div class="foot">
      <button type="button" class="ghost" onclick="$('#dlg').close()">Cancelar</button>
      <button class="pri">Guardar en BD</button>
    </div>
  </form>
</dialog>

<!-- MODAL DE CONSULTA (RESPUESTAS DE RECADOS / TUTORES EXCLUSIVOS) -->
<dialog id="dlg-info">
  <header><h2 id="info-title"></h2></header>
  <div id="info-body"></div>
  <div class="foot">
    <button type="button" class="pri" onclick="$('#dlg-info').close()">Cerrar</button>
  </div>
</dialog>

<script>
const API_URL = ["localhost", "127.0.0.1", ""].includes(location.hostname)
  ? "http://localhost:5000"
  : "https://primer-entrega-de-proyecto.onrender.com";
const SK = "escuela-sesion-pg";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n || 0).toLocaleString("es-MX", {minimumFractionDigits: 2});

const ST = {
  "Completado":"ok", "Atendido":"ok", "Pagado":"ok", "Confirmado":"ok", "Aceptado":"ok", "Respondido":"ok",
  "En proceso":"wip", "Leido":"wip", "Texto":"wip", "En observacion":"warn",
  "Pendiente":"warn", "Parcial":"warn", "Enviado":"warn",
  "Canalizado":"err"
};

const PERM = {
  Administrativo: {alumnos:"w", academico:"w", horario:"w", mapa:"r", recados:"w", pagos:"w", personal:"r"},
  Docente:        {alumnos:"r", academico:"w", horario:"r", mapa:"r", recados:"w", enfermeria:"r"},
  Enfermeria:     {alumnos:"r", mapa:"r", enfermeria:"w"},
  Cafeteria:      {alumnos:"r", cafeteria:"w"},
  Mantenimiento:  {mapa:"r", mantenimiento:"w"}
};

const GROUPS = [
  ["", ["dash", "mio"]],
  ["Escuela", ["alumnos", "academico", "horario", "mapa", "recados", "pagos", "personal"]],
  ["Servicios", ["enfermeria", "cafeteria", "mantenimiento"]],
  ["Acceso", ["usuarios"]]
];

const TITLES = {
  dash: ["Panel de la escuela", "Resumen en tiempo real desde PostgreSQL."],
  mio: ["Mi espacio", "Tu horario semanal, salón y calificaciones registradas."],
  alumnos: ["Alumnos y tutores", "Matrículas, CURP, grupos, salón fijo y tutores exclusivos (máx. 2).", "Agregar alumno"],
  academico: ["Gestión académica", "Calificaciones registradas por alumno y materia.", "Registrar calificación"],
  horario: ["Horarios (L–V)", "Clases semanales por grupo, materia, docente y salón.", "Agregar clase"],
  mapa: ["Croquis interactivo", "Ubicación de grupos y espacios escolares de Lunes a Viernes."],
  recados: ["Recados a padres", "Envía recados a tu grupo o a un alumno y revisa las respuestas de las familias.", "Enviar recado"],
  pagos: ["Colegiaturas", "Pagos de colegiatura registrados por periodo.", "Registrar pago"],
  personal: ["Personal", "Plantilla laboral, puestos y sueldos mensuales.", "Agregar empleado"],
  enfermeria: ["Enfermería", "Bitácora de atenciones médicas brindadas a alumnos.", "Registrar atención"],
  cafeteria: ["Cafetería", "Ventas realizadas a alumnos en turno escolar.", "Registrar venta"],
  mantenimiento: ["Mantenimiento", "Reportes de instalaciones y estado de atención.", "Reportar incidencia"],
  usuarios: ["Usuarios", "Cuentas de acceso y permisos por rol.", "Crear usuario"]
};

let S = null, cur = "dash", q = "", cat = {}, cache = {}, estadoSalones = [];

const lvl = k => !S ? "" : S.rol === "Director" ? "w" : (PERM[S.rol] || {})[k] || "";
const ok = k => k === "dash" ? ["Director", "Administrativo"].includes(S.rol) : k === "mio" ? S.rol === "Alumno" : !!lvl(k);

function toast(msg, type = "ok") {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "toast"; }, 4500);
}

async function api(path, opts = {}) {
  const res = await fetch(API_URL + path, {
    headers: {"Content-Type": "application/json"},
    ...opts
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Error en el servidor");
  return data;
}

/* Login y sesión */
$("#lf").onsubmit = async e => {
  e.preventDefault();
  $("#le").textContent = "";
  try {
    const res = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({usuario: $("#lu").value.trim(), password: $("#lc").value})
    });
    S = res.usuario;
    sessionStorage.setItem(SK, JSON.stringify(S));
    $("#lf").reset();
    await start();
  } catch (err) {
    $("#le").textContent = err.message;
  }
};

function logout() {
  sessionStorage.removeItem(SK);
  S = null;
  document.body.classList.add("out");
}

async function start() {
  document.body.classList.remove("out");
  const extraRol = S.grupo ? ` · ${S.grupo} (${S.clave_salon || ""})` : "";
  $("#who").textContent = `${S.nombre} · ${S.rol}${extraRol}`;
  cat = await api("/api/catalogos");
  cur = ok("dash") ? "dash" : ok("mio") ? "mio" : (S.rol === "Docente" ? "recados" : Object.keys(PERM[S.rol] || {})[0]);
  q = "";
  nav();
  await render();
}

function nav() {
  $("#nav").innerHTML = GROUPS.map(([g, ks]) => {
    ks = ks.filter(ok);
    if (!ks.length) return "";
    return (g ? `<p class="grp">${g}</p>` : "") +
      ks.map(k => `<button class="${k === cur ? "on" : ""}" onclick="go('${k}')">${TITLES[k][0]}</button>`).join("");
  }).join("");
}

async function go(k) {
  cur = k; q = "";
  nav();
  await render();
  scrollTo(0, 0);
}

async function render() {
  const [title, sub, addLabel] = TITLES[cur];
  const w = lvl(cur) === "w";
  const showAdd = w && addLabel;
  $("#head").innerHTML = `
    <div><h1>${title}</h1><p>${sub}${(!w && cur !== "dash" && cur !== "mio" && cur !== "mapa") ? " (Solo lectura)" : ""}</p></div>
    ${showAdd ? `<button class="pri" onclick="openForm('${cur}')">+ ${addLabel}</button>` : ""}
  `;
  $("#view").innerHTML = `<p class="empty">Cargando desde PostgreSQL...</p>`;

  try {
    if (cur === "dash") return await renderDash();
    if (cur === "mio") return await renderMine();
    if (cur === "mapa") return await renderMapa();
    await renderModule(cur);
  } catch (err) {
    $("#view").innerHTML = `<p class="empty">Error al consultar la base de datos: ${esc(err.message)}</p>`;
  }
}

/* ---------------- RESUMEN ---------------- */
async function renderDash() {
  const [alumnos, personal, cals, mant] = await Promise.all([
    api("/api/alumnos"), api("/api/personal"), api("/api/calificaciones"), api("/api/mantenimiento")
  ]);
  const prom = cals.length ? (cals.reduce((s, r) => s + Number(r.calificacion), 0) / cals.length).toFixed(1) : "–";
  const abiertos = mant.filter(r => r.estado !== "Completado").length;
  const fig = [
    [alumnos.length, "alumnos en 18 grupos"],
    [personal.length, "empleados en plantilla"],
    [prom, "promedio general"],
    [abiertos, "reportes de mantenimiento abiertos"]
  ];
  const por = {};
  alumnos.forEach(a => por[a.grupo] = (por[a.grupo] || 0) + 1);
  const max = Math.max(1, ...Object.values(por));
  const quickKeys = Object.keys(TITLES).filter(k => TITLES[k][2] && lvl(k) === "w");

  $("#view").innerHTML = `
    <div class="strip">${fig.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("")}</div>
    <div class="two">
      <section class="panel">
        <h2>Alumnos por grupo (1°A – 6°C)</h2>
        ${Object.keys(por).sort().map(g => `<div class="bar"><span>${esc(g)}</span><i style="width:${por[g] / max * 100}%"></i><em>${por[g]}</em></div>`).join("") || '<p class="empty">Sin alumnos.</p>'}
      </section>
      <section class="panel">
        <h2>Registro rápido</h2>
        <div class="quick">${quickKeys.map(k => `<button onclick="go('${k}').then(()=>openForm('${k}'))">${TITLES[k][2]}</button>`).join("")}</div>
      </section>
    </div>
  `;
}

/* ---------------- MI ESPACIO (ALUMNO) ---------------- */
async function renderMine() {
  const alumnos = await api("/api/alumnos");
  const me = alumnos.find(a => a.id_alumno === S.id_alumno);
  if (!me) {
    $("#view").innerHTML = `<p class="empty">Tu cuenta no está vinculada a un alumno en la base de datos.</p>`;
    return;
  }
  const [cals, hors] = await Promise.all([
    api(`/api/calificaciones?id_alumno=${me.id_alumno}`),
    api(`/api/horarios?id_grupo=${me.id_grupo}`)
  ]);
  const prom = cals.length ? (cals.reduce((s, r) => s + Number(r.calificacion), 0) / cals.length).toFixed(1) : "–";
  const mkTbl = (h, rows) => rows.length
    ? `<table><thead><tr>${h.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    : `<p class="empty">Sin registros todavía.</p>`;

  $("#view").innerHTML = `
    <div class="strip s3">
      <div><b>${esc(me.nombre_completo)}</b><span>${esc(me.curp)}</span></div>
      <div><b>${esc(me.grupo)} · ${esc(me.clave_salon || "—")}</b><span>grupo y salón fijo</span></div>
      <div><b>${prom}</b><span>promedio general</span></div>
    </div>
    <div class="two">
      <section class="panel"><h2>Horario semanal de ${esc(me.grupo)}</h2>${mkTbl(["Día", "Hora", "Materia", "Salón"], hors.map(r => [r.dia_semana, `${r.hora_inicio}-${r.hora_fin}`, r.materia, r.clave_salon]))}</section>
      <section class="panel"><h2>Calificaciones</h2>${mkTbl(["Materia", "Créditos", "Calificación"], cals.map(r => [r.materia, r.creditos, r.calificacion]))}</section>
    </div>
    <p class="hint" style="margin-top:14px">Tutores exclusivos: ${esc(me.tutores_exclusivos)} · Tel: ${esc(me.telefono)}</p>
  `;
}

/* ---------------- NUEVO CROQUIS INTERACTIVO SVG ---------------- */
async function renderMapa() {
  $("#view").innerHTML = `
    <div class="panel">
      <div class="map-bar">
        <label>Buscar alumno (opcional)
          <select id="m-al"><option value="">-- Ver ocupación general --</option>${cat.alumnos.map(a => `<option value="${a.id_alumno}">${esc(a.alumno)} (${esc(a.grupo)})</option>`).join("")}</select>
        </label>

        $("#m-det").innerHTML = `<b>${esc(s.clave_salon)}</b> (${esc(s.edificio)}) · Grupo <b>${esc(s.grupo)}</b> · ${esc(s.materia)} · Docente: <b>${esc(s.docente)}</b> (${s.hora_inicio}–${s.hora_fin})`;
      } else if (s) {
        $("#m-det").innerHTML = `<b>${esc(s.clave_salon)}</b> (${esc(s.edificio)}) está <b>disponible</b> en este bloque horario.`;
      } else {
        $("#m-det").innerHTML = `<b>Espacio seleccionado:</b> ${esc(el.dataset.nombre || el.id)}`;
      }
    };
  });
  $("#m-dia").onchange = cargarMapa;
  $("#m-hora").onchange = cargarMapa;
  $("#m-al").onchange = cargarMapa;
  await cargarMapa();

async function cargarMapa() {
  const dia = $("#m-dia").value, hora = $("#m-hora").value, idAl = $("#m-al").value;
  estadoSalones = await api(`/api/mapa?dia=${dia}&hora=${hora}`);
  document.querySelectorAll(".espacio-svg").forEach(el => el.classList.remove("espacio-ocupado", "espacio-activo"));
  estadoSalones.forEach(s => {
    const r = document.getElementById(s.codigo_svg);
    if (r && s.grupo) r.classList.add("espacio-ocupado");
  });
  if (idAl) {
    const res = await api(`/api/mapa?dia=${dia}&hora=${hora}&id_alumno=${idAl}`);
    if (res.length) {
      const info = res[0];
      document.getElementById(info.codigo_svg)?.classList.add("espacio-activo");
      $("#m-det").innerHTML = `<b>${esc(info.alumno)} (${esc(info.grupo)})</b> está en <b>${esc(info.clave_salon)}</b> (${esc(info.edificio)}) · Clase: <b>${esc(info.materia)}</b> · Docente: <b>${esc(info.docente)}</b> (${info.hora_inicio}–${info.hora_fin})`;
    } else {
      $("#m-det").textContent = "El alumno no tiene clase registrada en ese bloque.";
    }
  } else {
    $("#m-det").textContent = `Mostrando ocupación de salones el ${dia} a las ${hora}. Haz clic en cualquier espacio para ver detalles.`;
  }
}

async function renderModule(k) {
  const cfg = CONFIG[k];
  cache[k] = await api(cfg.ep());
  $("#view").innerHTML = `
    <div class="sheet">
      <div class="tools">
        <input type="search" placeholder="Buscar en ${TITLES[k][0].toLowerCase()}..." value="${esc(q)}" oninput="q=this.value.toLowerCase();fillTable('${k}')">
        <span id="cnt"></span>
      </div>
      <div class="tw">
        <table>
          <thead><tr>${cfg.cols.map(c => `<th>${c[1]}</th>`).join("")}<th></th></tr></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
  `;
  fillTable(k);
}

function fillTable(k) {
  const cfg = CONFIG[k], w = lvl(k) === "w";
  const rows = (cache[k] || []).filter(r => !q || cfg.cols.some(c => String(r[c[0]] ?? "").toLowerCase().includes(q)));
  $("#cnt").textContent = rows.length + (rows.length === 1 ? " registro" : " registros");
  $("#tb").innerHTML = rows.map(r => `
    <tr>
      ${cfg.cols.map(([field, , fmt]) => {
        const val = r[field];
        if (fmt === "tag") return `<td><span class="tag ${ST[val] || ""}">${esc(val)}</span></td>`;
        if (fmt === "money") return `<td>${money(val)}</td>`;
        return `<td>${esc(val)}</td>`;
      }).join("")}
      <td class="act">
        ${cfg.extra ? cfg.extra(r) : ""}
        ${w && !cfg.noDel ? `<button class="del" onclick="delRow('${k}',${r[cfg.id]})">Eliminar</button>` : ""}
      </td>
    </tr>
  `).join("") || `<tr><td class="empty" colspan="9">Sin registros que coincidan.</td></tr>`;
}

async function verRespuestas(idRecado, asunto) {
  $("#info-title").textContent = `Respuestas: ${asunto}`;
  $("#info-body").innerHTML = `<p class="empty">Consultando respuestas...</p>`;
  $("#dlg-info").showModal();
  try {
    const resps = await api(`/api/recados/${idRecado}/respuestas`);
    if (!resps.length) {
      $("#info-body").innerHTML = `<p class="empty">Aún ninguna familia ha respondido este recado.</p>`;
      return;
    }
    $("#info-body").innerHTML = resps.map(r => `
      <div class="resp-card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <b>${esc(r.alumno)} (${esc(r.grupo)})</b>
          <span class="tag ${ST[r.estado_respuesta] || "ok"}">${esc(r.estado_respuesta)}</span>
        </div>
        <div class="hint" style="margin-top:4px;">Tutor: ${esc(r.tutor)} · ${esc(r.fecha_respuesta)}</div>
        ${r.texto_respuesta ? `<p style="margin-top:6px;">"${esc(r.texto_respuesta)}"</p>` : ""}
      </div>
    `).join("");
  } catch (err) {
    $("#info-body").innerHTML = `<p class="empty">Error: ${esc(err.message)}</p>`;
  }
}

async function delRow(k, id) {
  if (!confirm("¿Eliminar este registro de PostgreSQL?")) return;
  try {
    await api(`${CONFIG[k].baseEp}/${id}`, {method: "DELETE"});
    toast("Registro eliminado de PostgreSQL.");
    await renderModule(k);
  } catch (err) { toast(err.message, "err"); }
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const k = $("#dlg").dataset.k;
  const body = Object.fromEntries(new FormData(e.target));

  try {
    if (k === "tutor_extra") {
      const idAl = body.id_alumno_target;
      await api(`/api/alumnos/${idAl}/tutores`, {method: "POST", body: JSON.stringify(body)});
      $("#dlg").close();
      toast("Segundo tutor exclusivo registrado en PostgreSQL.");
      await renderModule("alumnos");
      return;
    }

    if (k === "enfermeria") body.id_usuario_atiende = S.id_usuario;
    if (k === "cafeteria" || k === "mantenimiento") body.id_usuario_registra = S.id_usuario;
    if (k === "recados") {
      if (S.rol === "Docente") body.id_docente = S.id_docente;
      if (!body.id_alumno) delete body.id_alumno;
    }

    await api(CONFIG[k].baseEp, {method: "POST", body: JSON.stringify(body)});
    $("#dlg").close();
    toast("Registro guardado en PostgreSQL.");
    cat = await api("/api/catalogos");
    await renderModule(k);
  } catch (err) {
    alert("Error de base de datos: " + err.message);
  }
};
