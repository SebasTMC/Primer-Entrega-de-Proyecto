services:
  db:
    image: postgres:16-alpine
    container_name: primaria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primaria_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primaria_dev}
    ports:
      - "5435:5432"
    volumes:
      - primaria_pgdata:/var/lib/postgresql/data
      - ./migraciones:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-primaria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../Proyecto_Primaria/backend
    container_name: primaria_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-primaria_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-primaria_dev}
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  primaria_pgdata: